<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="WellMatch icon: a bold W with an upward arrow">
  <!--
    WellMatch Favicon
    Two-color, flat, geometric "W" with an integrated upward arrow.
    - Primary Green  #20C76F : right stroke of the W + arrow (growth, forward motion)
    - Secondary Dark #0F6D35 : left two strokes of the W (letterform anchor/weight)
    No gradients, shadows, or effects. Transparent background.
    All shapes built from SVG path primitives only.
  -->

  <!-- W: left downstroke + middle upstroke + start of right downstroke (dark green) -->
  <path d="M 100 168 L 196 380 L 256 224 L 316 380"
        fill="none"
        stroke="#0F6D35"
        stroke-width="72"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Arrow shaft: right stroke of the W continues upward as the arrow (primary green) -->
  <path d="M 316 380 L 387 197"
        fill="none"
        stroke="#20C76F"
        stroke-width="72"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Arrowhead: solid triangle, angled to match the shaft direction exactly -->
  <path d="M 426 96 L 432 214 L 342 179 Z"
        fill="#20C76F"/>
</svg>
